<svg width="1200" height="900" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" overflow="hidden"><defs><clipPath id="clip0"><rect x="0" y="0" width="1200" height="900"/></clipPath><clipPath id="clip1"><rect x="-9.31323e-10" y="0" width="1371600" height="922020"/></clipPath><clipPath id="clip3"><rect x="0" y="0" width="1364832" height="922020"/></clipPath><clipPath id="clip4"><rect x="0" y="0" width="1356360" height="60960"/></clipPath><clipPath id="clip6"><rect x="0" y="0" width="1200797" height="60960"/></clipPath><image width="225" height="152" xlink:href="data:image/png;base64," preserveAspectRatio="none" id="img2"></image><image width="1044" height="53" xlink:href="data:image/png;base64," preserveAspectRatio="none" id="img5"></image></defs><g clip-path="url(#clip0)"><rect x="0" y="0" width="1200" height="900" fill="#FFFFFF"/><g clip-path="url(#clip1)" transform="matrix(0.000131234 0 0 0.000131234 977 781)"><g clip-path="url(#clip3)" transform="matrix(1.00496 0 0 1 0.0229492 0.118652)"><use width="100%" height="100%" xlink:href="#img2" transform="scale(6065.92 6065.92)"></use></g></g><g clip-path="url(#clip4)" transform="matrix(0.000131234 0 0 0.000131234 103 189)"><g clip-path="url(#clip6)" transform="matrix(1.12955 0 0 1 0.012207 -0.0922852)"><use width="100%" height="100%" xlink:href="#img5" transform="scale(1150.19 1150.19)"></use></g></g><text fill="#26005C" font-family="Segoe UI,Segoe UI_MSFontService,Arial" font-weight="400" font-size="37" transform="translate(98.523 269)">&gt;</text><text fill="#26005C" font-family="Open Sans,Open Sans_MSFontService,Arial" font-weight="400" font-size="37" transform="translate(143.523 269)">Lu et al. applied 3 embedding levels to aid visual attention.</text><text fill="#26005C" font-family="Segoe UI,Segoe UI_MSFontService,Arial" font-weight="400" font-size="37" transform="translate(98.523 321)">&gt;</text><text fill="#26005C" font-family="Open Sans,Open Sans_MSFontService,Arial" font-weight="400" font-size="37" transform="translate(143.523 321)">Two types of embedding: static embedding (context</text><text fill="#26005C" font-family="Open Sans,Open Sans_MSFontService,Arial" font-weight="400" font-size="37" transform="translate(143.523 365)">independent) and dynamic embedding (context</text><text fill="#26005C" font-family="Open Sans,Open Sans_MSFontService,Arial" font-weight="400" font-size="37" transform="translate(143.523 409)">dependent).</text><text fill="#26005C" font-family="Segoe UI,Segoe UI_MSFontService,Arial" font-weight="400" font-size="37" transform="translate(98.523 462)">&gt;</text><text fill="#26005C" font-family="Open Sans,Open Sans_MSFontService,Arial" font-weight="400" font-size="37" transform="translate(143.523 462)">In the Hierarchical Co</text><text fill="#26005C" font-family="Open Sans,Open Sans_MSFontService,Arial" font-weight="400" font-size="37" transform="translate(508.931 462)">-</text><text fill="#26005C" font-family="Open Sans,Open Sans_MSFontService,Arial" font-weight="400" font-size="37" transform="translate(520.806 462)">attention work (2017), the</text><text fill="#26005C" font-family="Open Sans,Open Sans_MSFontService,Arial" font-weight="400" font-size="37" transform="translate(143.523 506)">researchers used static one</text><text fill="#26005C" font-family="Open Sans,Open Sans_MSFontService,Arial" font-weight="400" font-size="37" transform="translate(612.056 506)">-</text><text fill="#26005C" font-family="Open Sans,Open Sans_MSFontService,Arial" font-weight="400" font-size="37" transform="translate(623.931 506)">hot</text><text fill="#26005C" font-family="Open Sans,Open Sans_MSFontService,Arial" font-weight="400" font-size="37" transform="translate(681.431 506)">-</text><text fill="#26005C" font-family="Open Sans,Open Sans_MSFontService,Arial" font-weight="400" font-size="37" transform="translate(693.306 506)">encoding to get the</text><text fill="#26005C" font-family="Open Sans,Open Sans_MSFontService,Arial" font-weight="400" font-size="37" transform="translate(143.523 550)">question embedding.</text><text fill="#26005C" font-family="Segoe UI,Segoe UI_MSFontService,Arial" font-weight="400" font-size="37" transform="translate(98.523 603)">&gt;</text><text fill="#26005C" font-family="Open Sans,Open Sans_MSFontService,Arial" font-weight="400" font-size="37" transform="translate(143.523 603)">Vector representation needs to capture the semantic and</text><text fill="#26005C" font-family="Open Sans,Open Sans_MSFontService,Arial" font-weight="400" font-size="37" transform="translate(143.523 647)">syntactic relationships between words in a large corpus of</text><text fill="#26005C" font-family="Open Sans,Open Sans_MSFontService,Arial" font-weight="400" font-size="37" transform="translate(143.523 691)">text.</text><text fill="#26005C" font-family="Segoe UI,Segoe UI_MSFontService,Arial" font-weight="400" font-size="37" transform="translate(98.523 744)">&gt;</text><text fill="#26005C" font-family="Open Sans,Open Sans_MSFontService,Arial" font-weight="400" font-size="37" transform="translate(143.523 744)">In our work we used and compared various dynamic word</text><text fill="#26005C" font-family="Open Sans,Open Sans_MSFontService,Arial" font-weight="400" font-size="37" transform="translate(143.523 788)">embedding pretrained models.</text><text fill="#4B2E83" font-family="Calibri,Calibri_MSFontService,Arial" font-weight="700" font-size="50" transform="translate(100.157 102)">What can we change in Lu’s model to make it</text><text fill="#4B2E83" font-family="Calibri,Calibri_MSFontService,Arial" font-weight="700" font-size="50" transform="translate(100.157 162)">better (hypothesis)</text></g></svg>