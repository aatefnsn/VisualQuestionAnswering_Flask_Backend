name: Deploy to Azure Container Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allows manual trigger from GitHub UI

env:
  AZURE_RG: vqa-rg
  AZURE_REGISTRY: vqaregistry
  AZURE_CONTAINER_APP: vqa-backend
  IMAGE_NAME: vqa-backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y jq
    
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    
    - name: Get latest version from ACR
      id: get-version
      run: |
        set -e
        # Get all tags from ACR and find the latest version number
        TAGS=$(az acr repository show-tags --name ${{ env.AZURE_REGISTRY }} --repository ${{ env.IMAGE_NAME }} --orderby time_desc --output json 2>/dev/null || echo '[]')
        
        LATEST_VERSION=0
        for tag in $(echo "$TAGS" | jq -r '.[]'); do
          if [[ $tag =~ ^v([0-9]+)$ ]]; then
            VERSION_NUM=${BASH_REMATCH[1]}
            if [ $VERSION_NUM -gt $LATEST_VERSION ]; then
              LATEST_VERSION=$VERSION_NUM
            fi
          fi
        done
        
        NEW_VERSION=$((LATEST_VERSION + 1))
        VERSION_TAG="v$NEW_VERSION"
        PREVIOUS_VERSION="v$LATEST_VERSION"
        
        echo "Current version: $PREVIOUS_VERSION"
        echo "New version: $VERSION_TAG"
        echo "version=$VERSION_TAG" >> $GITHUB_OUTPUT
        echo "previous_version=$PREVIOUS_VERSION" >> $GITHUB_OUTPUT
    
    - name: Validate Dockerfile exists
      run: |
        if [ ! -f Dockerfile ]; then
          echo "Error: Dockerfile not found in repository root"
          exit 1
        fi
    
    - name: Build image in ACR
      run: |
        set -e
        az acr build \
          --registry ${{ env.AZURE_REGISTRY }} \
          --image ${{ env.IMAGE_NAME }}:${{ steps.get-version.outputs.version }} \
          --platform linux/amd64 \
          --file Dockerfile \
          --build-arg "AZURE_SAS_TOKEN=${{ secrets.AZURE_SAS_TOKEN }}" \
          -- .
    
    - name: Store previous version
      id: store-previous
      run: |
        # Store the previous image tag for potential rollback
        if [ "${{ steps.get-version.outputs.previous_version }}" != "v0" ]; then
          echo "previous_image=${{ env.AZURE_REGISTRY }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ steps.get-version.outputs.previous_version }}" >> $GITHUB_OUTPUT
        else
          echo "previous_image=" >> $GITHUB_OUTPUT
        fi
    
    - name: Deploy new version
      id: deploy
      run: |
        set -e
        echo "Deploying new version: ${{ steps.get-version.outputs.version }}"
        az containerapp update \
          --name ${{ env.AZURE_CONTAINER_APP }} \
          --resource-group ${{ env.AZURE_RG }} \
          --image ${{ env.AZURE_REGISTRY }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ steps.get-version.outputs.version }}
        
        echo "deployment_status=success" >> $GITHUB_OUTPUT
    
    - name: Get Container App URL
      id: get-url
      run: |
        set -e
        URL=$(az containerapp show \
          --name ${{ env.AZURE_CONTAINER_APP }} \
          --resource-group ${{ env.AZURE_RG }} \
          --query "properties.configuration.ingress.fqdn" \
          -o tsv)
        echo "url=https://$URL" >> $GITHUB_OUTPUT
        echo "CONTAINER_URL=https://$URL" >> $GITHUB_ENV
    
    - name: Wait for container to start
      run: |
        echo "Waiting for container to be ready..."
        sleep 15
    
    - name: Health check - Test endpoint responsiveness
      id: health-check
      run: |
        set +e
        MAX_ATTEMPTS=12
        ATTEMPT=1
        
        echo "Starting health checks..."
        while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
          echo "Attempt $ATTEMPT/$MAX_ATTEMPTS..."
          
          # Test health endpoint
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            --connect-timeout 5 \
            --max-time 10 \
            "${{ env.CONTAINER_URL }}/health")
          
          echo "  Health endpoint returned: $HTTP_CODE"
          
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✓ Container is healthy!"
            echo "health_check_status=passed" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
            echo "  Waiting before retry..."
            sleep 10
          fi
          
          ATTEMPT=$((ATTEMPT + 1))
        done
        
        echo "✗ Health check failed!"
        echo "health_check_status=failed" >> $GITHUB_OUTPUT
        exit 1
    
    - name: Test predict endpoint
      id: predict-test
      if: steps.health-check.outputs.health_check_status == 'passed'
      run: |
        set +e
        echo "Testing /predict endpoint..."
        
        RESPONSE=$(curl -s -w "\n%{http_code}" \
          --connect-timeout 5 \
          --max-time 10 \
          -X POST "${{ env.CONTAINER_URL }}/predict" \
          -F "question=test")
        
        HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
        BODY=$(echo "$RESPONSE" | sed '$d')
        
        echo "Response code: $HTTP_CODE"
        
        # Accept 200, 400 (bad request - expected for test) or 422
        if [[ "$HTTP_CODE" =~ ^(200|400|422)$ ]]; then
          echo "✓ Predict endpoint is responsive"
          echo "predict_test_status=passed" >> $GITHUB_OUTPUT
          exit 0
        else
          echo "✗ Predict endpoint returned unexpected status"
          echo "predict_test_status=failed" >> $GITHUB_OUTPUT
          exit 1
        fi
    
    - name: Rollback on failure
      if: failure() && steps.store-previous.outputs.previous_image != ''
      run: |
        set -e
        echo "⚠️  Health checks failed. Rolling back to previous version..."
        
        az containerapp update \
          --name ${{ env.AZURE_CONTAINER_APP }} \
          --resource-group ${{ env.AZURE_RG }} \
          --image ${{ steps.store-previous.outputs.previous_image }}
        
        echo "✓ Rollback completed. Running on: ${{ steps.store-previous.outputs.previous_image }}"
    
    - name: Rollback notification
      if: failure() && steps.store-previous.outputs.previous_image != ''
      run: |
        echo "### ⚠️ Deployment Failed - Rolled Back" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**New Version:** ${{ steps.get-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
        echo "**Previous Version:** ${{ steps.get-version.outputs.previous_version }}" >> $GITHUB_STEP_SUMMARY
        echo "**Reason:** Health checks failed" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "The container was rolled back to the previous stable version." >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Logs:** Check the workflow run details for more information." >> $GITHUB_STEP_SUMMARY
    
    - name: Deployment Summary
      if: success()
      run: |
        echo "### ✅ Deployment Successful!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Version:** ${{ steps.get-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
        echo "**Image:** ${{ env.AZURE_REGISTRY }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ steps.get-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
        echo "**URL:** ${{ steps.get-url.outputs.url }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Health Check:** ✓ Passed" >> $GITHUB_STEP_SUMMARY
        echo "**Endpoint Tests:** ✓ Passed" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Resource Group:** ${{ env.AZURE_RG }}" >> $GITHUB_STEP_SUMMARY
        echo "**Container App:** ${{ env.AZURE_CONTAINER_APP }}" >> $GITHUB_STEP_SUMMARY

  test:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run unit tests
      run: |
        echo "Running unit tests..."
        python -m pytest test_backend.py -v --tb=short || python -m unittest test_backend.py -v
    
    - name: Test results summary
      if: always()
      run: echo "✓ Unit tests completed"
